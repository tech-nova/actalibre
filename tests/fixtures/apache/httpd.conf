ServerRoot "@INFRA@"
PidFile "@INFRA@/apache.pid"
DefaultRuntimeDir "@INFRA@"
Listen 127.0.0.1:@PORT@
ServerName localhost
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/modules/mod_authz_host.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.3.so
User @USER@
Group @GROUP@
StartServers 3
MinSpareServers 2
MaxSpareServers 3
MaxRequestWorkers 4
MaxConnectionsPerChild 100
ErrorLog "@INFRA@/apache.log"
LogLevel warn
DocumentRoot "@DOCUMENT@"
@ALIAS@
TypesConfig /etc/mime.types
DirectoryIndex index.php
AddType application/x-httpd-php .php
PHPIniDir /etc/php/8.3/apache2
php_admin_value error_log "@INFRA@/php.log"
php_admin_value session.save_path "@INFRA@/sessions"
php_admin_flag display_errors Off
@PHP@
<Directory />
    Require all denied
    AllowOverride None
</Directory>
<Directory "@ROOT@">
    Options -Indexes
    Require all granted
    AllowOverride @OVERRIDE@
</Directory>
